name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 零第三方依赖：不需要 pip install，也不需要任何 API key
      - name: Unit and regression tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Offline demo (mock model, crash and resume)
        run: python examples/demo.py
